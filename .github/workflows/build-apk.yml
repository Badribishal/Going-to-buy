name: Build & Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"

          if [ -z "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME is not set!" >&2
            exit 1
          fi

          # Detect active Java major version
          RAW_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected raw Java version string: $RAW_VERSION"

          if [ -z "$RAW_VERSION" ]; then
            echo "ERROR: Could not detect Java version string!" >&2
            exit 1
          fi

          MAJOR_VERSION=$(echo "$RAW_VERSION" | awk -F '.' '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java major version: $MAJOR_VERSION"

          if [ -z "$MAJOR_VERSION" ] || ! [ "$MAJOR_VERSION" -eq "$MAJOR_VERSION" ] 2>/dev/null; then
            echo "ERROR: Could not parse numeric Java major version!" >&2
            exit 1
          fi

          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "ERROR: Active Java major version ($MAJOR_VERSION) is lower than 17!" >&2
            exit 1
          fi

          echo "Java environment verified successfully: Java $MAJOR_VERSION (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to create or locate debug.keystore!" >&2
            exit 1
          fi
          echo "Temporary debug keystore is present and verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$EXPECTED_APK" ]; then
            echo "Found expected APK: $EXPECTED_APK"
          else
            echo "ERROR: Expected APK not found at $EXPECTED_APK!" >&2
            echo "Searching only inside app/build/outputs/apk..." >&2
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 4 -name "*.apk" >&2
            else
              echo "Directory app/build/outputs/apk does not exist!" >&2
            fi
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: $EXPECTED_APK is not a regular file!" >&2
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: $EXPECTED_APK is empty!" >&2
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "ERROR: $EXPECTED_APK does not have .apk extension!" >&2; exit 1 ;;
          esac

          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: APK path is not exactly app/build/outputs/apk/debug/app-debug.apk!" >&2
            exit 1
          fi

          echo "APK verified successfully: $(ls -lh "$EXPECTED_APK")"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          ASSET_DIR="${RUNNER_TEMP}/release-assets"
          mkdir -p "$ASSET_DIR"

          REPO_RAW="${{ github.event.repository.name }}"
          if [ -z "$REPO_RAW" ]; then
            REPO_RAW=$(echo "${{ github.repository }}" | awk -F '/' '{print $2}')
          fi
          REPO_SANITIZED=$(echo "$REPO_RAW" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g' | sed 's/^-*//;s/-*$//')
          if [ -z "$REPO_SANITIZED" ]; then
            REPO_SANITIZED="android-app"
          fi

          RELEASE_FILENAME="${REPO_SANITIZED}-debug-build-${{ github.run_number }}.apk"
          TARGET_PATH="${ASSET_DIR}/${RELEASE_FILENAME}"

          echo "Copying APK to $TARGET_PATH..."
          cp "app/build/outputs/apk/debug/app-debug.apk" "$TARGET_PATH"

          if [ ! -f "$TARGET_PATH" ] || [ ! -s "$TARGET_PATH" ]; then
            echo "ERROR: Prepared release asset is missing or empty!" >&2
            exit 1
          fi

          echo "asset_path=$TARGET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_filename=$RELEASE_FILENAME" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $TARGET_PATH ($RELEASE_FILENAME)"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          RELEASE_ASSET_FILENAME: ${{ steps.prepare_asset.outputs.asset_filename }}
        run: |
          echo "Checking GitHub CLI availability..."
          gh --version

          if [ -z "$RELEASE_ASSET_PATH" ] || [ ! -f "$RELEASE_ASSET_PATH" ] || [ ! -s "$RELEASE_ASSET_PATH" ]; then
            echo "ERROR: Valid release asset is required for release creation!" >&2
            exit 1
          fi

          case "$RELEASE_ASSET_PATH" in
            *.apk) ;;
            *) echo "ERROR: Release asset does not have .apk extension!" >&2; exit 1 ;;
          esac

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          TARGET_COMMIT="${{ github.sha }}"

          NOTES=$(cat << EOF
### Automated Debug APK Build

- This is an automatically generated debug APK.
- The APK was built by GitHub Actions.
- GitHub Actions run number: ${{ github.run_number }}
- GitHub Actions run attempt: ${{ github.run_attempt }}
- Source commit SHA: ${{ github.sha }}
- The APK is intended for testing.
- The APK is not a Play Store production release.
- The APK is signed only with a temporary debug keystore.
EOF
          )

          echo "Creating GitHub Release with tag: $RELEASE_TAG..."
          gh release create "$RELEASE_TAG" "$RELEASE_ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --target "$TARGET_COMMIT" \
            --notes "$NOTES" \
            --latest

          echo "Release created successfully."

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}
          RELEASE_TITLE: Debug APK Build #${{ github.run_number }}
          ASSET_FILENAME: ${{ steps.prepare_asset.outputs.asset_filename }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
        run: |
          echo "### Build & Release Summary" >> "$GITHUB_STEP_SUMMARY"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "GitHub Release published successfully."
            gh release view "$RELEASE_TAG"

            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url 2>/dev/null || echo "https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}")

            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "Asset Filename: $ASSET_FILENAME"

            echo "- **Status:** ✅ Debug APK built and published to GitHub Releases" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Tag:** \`$RELEASE_TAG\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Page:** [$RELEASE_TITLE]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Asset:** \`$ASSET_FILENAME\` (download directly from the release Assets section on your phone)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Backup Artifact:** The standard GitHub Actions artifact \`app-debug-apk\` is also preserved and available." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not succeed or was skipped."
            echo "Debug APK build and artifact upload completed successfully."
            echo "The Actions artifact named 'app-debug-apk' remains available for download."

            echo "- **Status:** ⚠️ Debug APK build succeeded, but GitHub Release publishing was unsuccessful or skipped." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Actions Artifact Available:** The debug APK was preserved as artifact **\`app-debug-apk\`**. You can download it directly from the GitHub Actions run summary." >> "$GITHUB_STEP_SUMMARY"
          fi
